---
- name: Restart cron
  ansible.builtin.systemd:
    name: cron
    state: restarted

- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Reconfigure locale
  ansible.builtin.command:
    cmd: dpkg-reconfigure locales --frontend noninteractive
    creates: /etc/locale.gen

- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 1200

- name: Restart Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ raspberry_pi_samba_services }}"

- name: Restart log2ram
  ansible.builtin.systemd:
    name: log2ram
    state: restarted

# Reconstruction du swap après changement de taille (bigger_swap.yml), dans cet ordre.
- name: Stop dphys-swapfile service
  ansible.builtin.service:
    name: dphys-swapfile
    state: stopped
  listen: Rebuild swap

- name: Disable swap
  ansible.builtin.command:
    cmd: dphys-swapfile swapoff
  changed_when: true
  listen: Rebuild swap

- name: Recreate the swap file
  ansible.builtin.command:
    cmd: dphys-swapfile setup
  changed_when: true
  listen: Rebuild swap

- name: Enable swap
  ansible.builtin.command:
    cmd: dphys-swapfile swapon
  changed_when: true
  listen: Rebuild swap

- name: Start dphys-swapfile service
  ansible.builtin.service:
    name: dphys-swapfile
    state: started
  listen: Rebuild swap

- name: Restart SABnzbd
  ansible.builtin.systemd:
    name: sabnzbdplus
    state: restarted
    daemon_reload: true

- name: Restart MPD
  ansible.builtin.service:
    name: mpd
    state: restarted

- name: Apply hdparm spindown
  ansible.builtin.command:
    cmd: "hdparm -S {{ raspberry_pi_sda_spindown }} /dev/sda"
  changed_when: true
