---
# Le module copy compare lui-même les sommes de contrôle : il ne copie que si le fichier diffère.
# (L'ancienne version calculait ces sommes à la main avec stat, mais stat lisait files/... sur le Pi
# au lieu de la machine Ansible, et relisait des variables jamais enregistrées : rien n'était copié.)
- name: "Copy .bash_aliases to admin users' home directories"
  ansible.builtin.copy:
    src: files/bash_aliases
    dest: "/home/{{ bash_user.name }}/.bash_aliases"
    owner: "{{ bash_user.name }}"
    group: "{{ bash_user.name }}"
    mode: '0644'
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: bash_user
    label: "{{ bash_user.name }}"
  become: true

- name: "Copy .bashrc to admin users' home directories"
  ansible.builtin.copy:
    src: files/bashrc
    dest: "/home/{{ bash_user.name }}/.bashrc"
    owner: "{{ bash_user.name }}"
    group: "{{ bash_user.name }}"
    mode: '0644'
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: bash_user
    label: "{{ bash_user.name }}"
  become: true
