---
- name: Ensure ufw is installed.
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set ufw policy
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Enabling ufw logging
  community.general.ufw:
    logging: 'on'

- name: Enable and rate limit ssh port
  community.general.ufw:
    rule: limit
    port: '{{ ssh_port | default(22) }}'
    proto: tcp
