---
# Installation de Docker depuis le dépôt apt officiel (https://docs.docker.com/engine/install/debian/).
# - Dépôt au format deb822 avec Signed-By (apt_key / apt-key sont obsolètes, absents de Debian 13).
# - Dépôt choisi selon l'architecture des paquets (dpkg) et non du noyau : un Pi 4/5 avec un noyau
#   64 bits peut tourner sur un Raspberry Pi OS 32 bits, qui a besoin du dépôt raspbian armhf.
# - Idempotent : aucun redémarrage de Docker (ni de ses conteneurs) quand rien n'a changé.

- name: Install necessary packages
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian # requis par le module deb822_repository
    state: present

- name: Get the packages architecture (dpkg)
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_dpkg_arch
  changed_when: false
  check_mode: false

# arm64 (Pi 3/4/5 en Raspberry Pi OS 64 bits) -> dépôt debian ; armhf (Raspberry Pi OS 32 bits) -> dépôt raspbian
- name: Choose the Docker repository
  ansible.builtin.set_fact:
    docker_apt_arch: "{{ docker_dpkg_arch.stdout | trim }}"
    docker_apt_distro: "{{ 'raspbian' if (docker_dpkg_arch.stdout | trim) == 'armhf' else 'debian' }}"

# Anciennes versions de cette tâche : dépôt déclaré sans signed-by (apt_repository + apt_key). Le laisser
# à côté du nouveau ferait échouer apt update (« Conflicting values set for option Signed-By »).
- name: Remove Docker repositories declared by previous versions of this role
  become: true
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - download_docker_com_linux_debian.list
    - download_docker_com_linux_raspbian.list

# deb822_repository télécharge la clé lui-même (dans /etc/apt/keyrings) et n'a besoin ni de gpg ni d'apt-key.
- name: Add Docker repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ docker_apt_distro }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ docker_apt_arch }}"
    signed_by: "https://download.docker.com/linux/{{ docker_apt_distro }}/gpg"
    state: present
  register: docker_repository

- name: Install Docker packages
  become: true
  ansible.builtin.apt:
    # Cache apt rafraîchi seulement si le dépôt vient d'être ajouté ou modifié.
    update_cache: "{{ docker_repository.changed }}"
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is started and enabled on boot
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# Le groupe docker est créé par le paquet docker-ce. Effectif à la prochaine connexion de l'utilisateur.
- name: Add admin users to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: docker
    append: true
  loop: "{{ users_admin }}"
  loop_control:
    label: "{{ item.name }}"
