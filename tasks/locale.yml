---
# Tâches idempotentes sans condition : un passage interrompu se rattrape au suivant
# (avant, elles ne s'exécutaient que si la locale venait d'être générée).
- name: Setup locale
  community.general.locale_gen:
    name: '{{ raspberry_pi_locale }}'
    state: present

- name: Remove english locale
  community.general.locale_gen:
    name: en_GB.UTF-8
    state: absent
  when: raspberry_pi_locale != 'en_GB.UTF-8'

- name: Ensure locale environment variables are set
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: |
      LANG={{ raspberry_pi_locale }}
      LC_CTYPE={{ raspberry_pi_locale }}
      LC_MESSAGES={{ raspberry_pi_locale }}
      LC_COLLATE={{ raspberry_pi_locale }}
      LC_ALL={{ raspberry_pi_locale }}
    mode: '0644'

- name: Install French man pages
  ansible.builtin.apt:
    name: manpages-fr
    state: present
  become: true
  when: raspberry_pi_locale is match('fr_')

- name: Install keyboard keymaps
  ansible.builtin.apt:
    name: console-data
    state: present
  become: true

- name: Set persistent keyboard layout
  ansible.builtin.lineinfile:
    path: /etc/default/keyboard
    regexp: '^XKBLAYOUT='
    line: "XKBLAYOUT={{ raspberry_pi_keyboard }}"
    create: true
    mode: '0644'
  become: true
