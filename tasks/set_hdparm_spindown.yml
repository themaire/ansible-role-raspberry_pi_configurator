---
- name: Installer hdparm
  ansible.builtin.apt:
    name: hdparm
    state: present
    update_cache: true

# Le handler applique tout de suite la même valeur (hdparm -S {{ raspberry_pi_sda_spindown }}) ;
# avant, la commande appliquait 120 en dur à chaque passage, quelle que soit la variable.
- name: Configurer le fichier /etc/hdparm.conf pour /dev/sda
  ansible.builtin.blockinfile:
    path: /etc/hdparm.conf
    block: |
      /dev/sda {
          spindown_time = {{ raspberry_pi_sda_spindown }}
      }
    marker: "# {mark} ANSIBLE: hdparm config for /dev/sda"
  notify: Apply hdparm spindown
