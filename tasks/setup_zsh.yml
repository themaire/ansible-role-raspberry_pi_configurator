---
- name: Install required packages
  ansible.builtin.apt:
    name: zsh
    state: present
    update_cache: true

- name: Set Zsh as default shell for users
  ansible.builtin.user:
    name: "{{ zsh_user.name }}"
    shell: /usr/bin/zsh
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

- name: Download Oh My Zsh install script for each user
  ansible.builtin.get_url:
    url: "{{ raspberry_pi_oh_my_zsh_url }}"
    dest: "/home/{{ zsh_user.name }}/install-oh-my-zsh.sh"
    mode: '0755'
  become: true
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

- name: Installer Oh My Zsh pour chaque utilisateur (mode non interactif, HOME forcé)
  ansible.builtin.command:
    cmd: "sh /home/{{ zsh_user.name }}/install-oh-my-zsh.sh --unattended"
    creates: "/home/{{ zsh_user.name }}/.oh-my-zsh"
  become: true
  environment:
    HOME: "/home/{{ zsh_user.name }}"
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

- name: Corriger les droits sur .oh-my-zsh
  ansible.builtin.file:
    path: "/home/{{ zsh_user.name }}/.oh-my-zsh"
    owner: "{{ zsh_user.name }}"
    group: "{{ zsh_user.name }}"
    recurse: true
  become: true
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

# Le module git est idempotent (update: false : jamais de mise à jour d'un dépôt déjà cloné).
# Avant, un stat préalable lisait results[0] : le premier utilisateur décidait pour tous.
- name: Clone fzf repository for each user
  ansible.builtin.git:
    repo: "{{ raspberry_pi_fzf_repo_url }}"
    dest: "/home/{{ zsh_user.name }}/.fzf"
    version: master
    depth: 1
    update: false
  become: true
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

- name: Run fzf install script for each user
  ansible.builtin.command:
    cmd: "/home/{{ zsh_user.name }}/.fzf/install --all"
    chdir: "/home/{{ zsh_user.name }}/.fzf"
    creates: "/home/{{ zsh_user.name }}/.fzf/bin/fzf"
  become: true
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

- name: Clone zsh-syntax-highlighting plugin for each user
  ansible.builtin.git:
    repo: "{{ raspberry_pi_zsh_syntax_highlighting_url }}"
    dest: "{{ raspberry_pi_zsh_custom_dir }}/zsh-syntax-highlighting"
    version: master
    update: false
  become: true
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

- name: Clone zsh-autosuggestions plugin for each user
  ansible.builtin.git:
    repo: "{{ raspberry_pi_zsh_autosuggestions_url }}"
    dest: "{{ raspberry_pi_zsh_custom_dir }}/zsh-autosuggestions"
    version: master
    update: false
  become: true
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

