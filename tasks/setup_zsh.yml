# Créer le dossier /usr/local/share/zsh_custom avec les permissions appropriées
- name: Create /usr/local/share/zsh_custom directory
  ansible.builtin.file:
    path: /usr/local/share/zsh_custom
    state: directory
    mode: '0755'
  become: true

# Charger le fichier d'alias global depuis /etc/zsh/zshrc (une seule fois, et seulement s'il existe).
# Avant : « command: echo ... | sudo tee -a » — sans shell, le pipe n'était qu'un argument d'echo,
# la ligne n'était jamais ajoutée (et avec un shell, elle l'aurait été à chaque passage).
- name: Add global aliases to /etc/zsh/zshrc
  ansible.builtin.lineinfile:
    path: /etc/zsh/zshrc
    line: '[ -f /usr/local/share/zsh_custom/global_aliases.zsh ] && source /usr/local/share/zsh_custom/global_aliases.zsh'
    create: true
    mode: '0644'
  become: true

- name: Copy the zshrc config file
  ansible.builtin.copy:
    src: "files/.zshrc"
    dest: "/home/{{ zsh_user.name }}/.zshrc"
    owner: "{{ zsh_user.name }}"
    group: "{{ zsh_user.name }}"
    mode: '0644'
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"

- name: Change ownership and permissions of .zshrc for each user
  ansible.builtin.file:
    path: "/home/{{ zsh_user.name }}/.zshrc"
    owner: "{{ zsh_user.name }}"
    group: "{{ zsh_user.name }}"
    mode: '0644'
  loop: "{{ users_admin }}"
  loop_control:
    loop_var: zsh_user
    label: "{{ zsh_user.name }}"
